# === SERVICE AYARLARI ===
server.port=8769
spring.application.name=stock-service

# === DATABASE (PostgreSQL) ===
spring.datasource.url=jdbc:postgresql://localhost:5434/stock_db
spring.datasource.username=postgres
spring.datasource.password=123
# Dialect hatas?n? çözen 2 sihirli sat?r:
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# === RABBITMQ ===
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5674
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# === STOCK SERVICE QUEUE & EXCHANGE AYARLARI ===
stock.rabbit.exchange=stock.events.exchange

# Order -> (exchange, routingKey) -> Stock queue
stock.rabbit.reserveRequestedRoutingKey=order.stock.reserve.requested
stock.rabbit.reserveRequestedQueue=stock.reserve.requested.queue

# Stock -> (exchange, routingKey)
stock.rabbit.reservedRoutingKey=order.stock.reserved
stock.rabbit.rejectedRoutingKey=order.stock.rejected

# (Opsiyonel DLX / DLQ)
stock.rabbit.dlx=stock.events.dlx
stock.rabbit.dlq=stock.reserve.requested.dlq

# === EUREKA ===
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# === LOGGING ===
logging.level.org.springframework=INFO
logging.level.com.n11bootcamp.stock_service=DEBUG