name: KubaShop CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile backend services
        shell: bash
        run: |
          services=(
            config-server
            discovery-server
            api-gateway
            user-service
            product-service
            shopping-card-service
            stock-service
            order-service
            payment-service
          )

          for service in "${services[@]}"; do
            echo "Compiling $service"
            mvn -B -f "n11-talenthub-project-be/$service/pom.xml" clean compile -DskipTests
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ecommerce-frontend/package-lock.json

      - name: Build frontend
        working-directory: ecommerce-frontend
        run: |
          npm ci
          npm test -- --runInBand
          npm run build

  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e

            APP_DIR="/root/n11-talenthub-bootcamp-final-project"
            REPO_URL="https://x-access-token:${{ secrets.GH_PAT }}@github.com/kubrakaradirek/n11-talenthub-bootcamp-final-project.git"

            cd "$APP_DIR"
            git pull "$REPO_URL" main

            services="config-server discovery-server api-gateway user-service product-service shopping-card-service stock-service order-service payment-service"
            for service in $services; do
              echo "Building Docker image for $service"
              cd "$APP_DIR/n11-talenthub-project-be/$service"
              mvn -B clean compile jib:dockerBuild -DskipTests
            done

            cd "$APP_DIR"
            docker compose up -d

            cd "$APP_DIR/ecommerce-frontend"
            printf "REACT_APP_API_BASE_URL=http://${{ secrets.VPS_HOST }}:8763\n" > .env
            npm ci
            npm run build

            rm -rf /var/www/kubashop
            mkdir -p /var/www/kubashop
            cp -r dist/* /var/www/kubashop/

            nginx -t
            systemctl reload nginx

            docker ps
