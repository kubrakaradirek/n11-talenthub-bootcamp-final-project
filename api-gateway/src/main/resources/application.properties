# =========================================================
# n11 TalentHub - API GATEWAY
# =========================================================
spring.application.name=api-gateway
server.port=8763

spring.main.web-application-type=reactive
spring.main.allow-bean-definition-overriding=true

# Eureka & Config Server
spring.cloud.config.uri=${CONFIG_URI:http://localhost:8762}
spring.config.import=optional:configserver:${CONFIG_URI:http://localhost:8762}
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}

# 5. Gateway Discovery & Route Ayarlar?
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true
a
# --- Ürün Servisi ---
spring.cloud.gateway.server.webflux.routes[0].id=PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[0].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/products/**

# --- User Servisi ---
spring.cloud.gateway.server.webflux.routes[1].id=USER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/user/**

# --- Sepet Service  ---
spring.cloud.gateway.server.webflux.routes[2].id=SHOPPING-CART-SERVICE
spring.cloud.gateway.server.webflux.routes[2].uri=lb://SHOPPING-CART-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/shopping-cart/**,/api/shopping-cart


spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# Güvenlik Ayarlar?
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/microservice-realm
