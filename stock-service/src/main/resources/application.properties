# -------------------------
# Basic Settings
# -------------------------
spring.application.name=stock-service
server.port=8084

# -------------------------
# Config Server and Eureka
# -------------------------
spring.config.import=optional:configserver:${CONFIG_URI:http://localhost:8762}
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/microservice-realm

# Veritabani
spring.datasource.url=jdbc:postgresql://localhost:5434/stock_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RabbitMQ Ana Ayarlar
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5674
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Oder Ayarlar
stock.rabbit.exchange=stock.events.exchange
stock.rabbit.reserveRequestedQueue=order.stock.reserve.queue
stock.rabbit.reserveRequestedRoutingKey=order.stock.reserve.requested
stock.rabbit.reservedRoutingKey=stock.reserved
stock.rabbit.rejectedRoutingKey=stock.rejected

# DLX ve DLQ (Hata yönetimi alanlari
stock.rabbit.dlx=stock.dlx.exchange
stock.rabbit.dlq=stock.dead.letter.queue
